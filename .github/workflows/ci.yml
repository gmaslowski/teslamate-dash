name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l ./src)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ./src"
            exit 1
          fi
      - run: go vet ./...
      - run: go build -o /dev/null ./src
